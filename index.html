    <!--
      The font stylesheet is requested here rather than through an @import
      inside index.css. An @import is only discovered once the CSS bundle has
      downloaded and parsed, which serialises the font fetch behind it and
      delays first paint; a link in the head is seen by the preload scanner
      immediately and fetched in parallel.

      It loads non-blocking (media="print" flipped to "all" on load) so text
      paints in the fallback face right away instead of waiting on the
      network, with a no-script fallback copy for clients without scripting.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" media="print" onload="this.media='all'" />
