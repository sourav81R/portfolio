<!doctype html>
<html lang="en">
  <head>
    <!-- ================= Basic ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The full name leads the title: the primary search this site must win is
      someone googling "Sourav Chowdhury", and Google weights the title's
      opening words most heavily. Kept under ~60 chars so it is not truncated
      in results.
    -->
    <title>Sourav Chowdhury - Full Stack Developer (MERN, React)</title>

    <!-- ================= SEO ================= -->
    <meta
      name="description"
      content="Sourav Chowdhury is a full stack developer in Kolkata, India, building fast, scalable web apps with React, TypeScript, Node.js and MongoDB. Open to full-time software engineering roles."
    />
    <meta name="author" content="Sourav Chowdhury" />
    <meta
      name="keywords"
      content="Sourav Chowdhury, Sourav Chowdhury developer, Full Stack Developer Kolkata, React Developer, TypeScript Developer, MERN Stack Developer, Software Engineer Portfolio, React Native"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!--
      One canonical host. The site answers on both the apex domain and its
      Vercel deployment URL; without this, Google treats them as duplicates and
      splits ranking signals between them.
    -->
    <link rel="canonical" href="https://sourav.is-a.dev/" />

    <!-- ================= Open Graph ================= -->
    <meta property="og:site_name" content="Sourav Chowdhury" />
    <meta property="og:title" content="Sourav Chowdhury - Full Stack Developer (MERN, React)" />
    <meta
      property="og:description"
      content="Full stack developer in Kolkata, India, building fast, scalable web apps with React, TypeScript, Node.js and MongoDB. Open to full-time roles."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://sourav.is-a.dev/" />
    <meta property="og:image" content="https://sourav.is-a.dev/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sourav Chowdhury - Full Stack Developer portfolio" />

    <!-- ================= Twitter Card ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sourav Chowdhury - Full Stack Developer (MERN, React)" />
    <meta
      name="twitter:description"
      content="Full stack developer in Kolkata, India. React, TypeScript, Node.js, MongoDB. Open to full-time roles."
    />
    <meta name="twitter:image" content="https://sourav.is-a.dev/og-preview.png" />
    <meta name="twitter:image:alt" content="Sourav Chowdhury - Full Stack Developer portfolio" />

    <!--
      ================= Structured data =================
      Person + WebSite schema. This is what lets Google show a rich result for
      the name query and understand which profiles belong to the same person;
      sameAs is the signal that ties the GitHub and LinkedIn identities to this
      site. The SearchAction declares the on-page command palette.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://sourav.is-a.dev/#person",
            "name": "Sourav Chowdhury",
            "givenName": "Sourav",
            "familyName": "Chowdhury",
            "url": "https://sourav.is-a.dev/",
            "image": "https://sourav.is-a.dev/profile.jpg",
            "jobTitle": "Full Stack Developer",
            "description": "Full stack developer building fast, scalable web apps with React, TypeScript, Node.js and MongoDB.",
            "email": "mailto:souravchowdhury0203@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kolkata",
              "addressRegion": "West Bengal",
              "addressCountry": "IN"
            },
            "knowsAbout": [
              "React",
              "TypeScript",
              "JavaScript",
              "Node.js",
              "MongoDB",
              "Next.js",
              "React Native",
              "Tailwind CSS",
              "Full Stack Development"
            ],
            "sameAs": [
              "https://github.com/sourav81R",
              "https://linkedin.com/in/souravchowdhury-2003r"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://sourav.is-a.dev/#website",
            "url": "https://sourav.is-a.dev/",
            "name": "Sourav Chowdhury - Full Stack Developer",
            "description": "Portfolio of Sourav Chowdhury, a full stack developer working with React, TypeScript, Node.js and MongoDB.",
            "inLanguage": "en",
            "publisher": { "@id": "https://sourav.is-a.dev/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://sourav.is-a.dev/#profilepage",
            "url": "https://sourav.is-a.dev/",
            "name": "Sourav Chowdhury - Full Stack Developer",
            "isPartOf": { "@id": "https://sourav.is-a.dev/#website" },
            "about": { "@id": "https://sourav.is-a.dev/#person" }
          }
        ]
      }
    </script>

    <!-- ================= PWA / Mobile ================= -->
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ================= Favicon ================= -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ================= Performance (Optional but Recommended) ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body class="bg-white dark:bg-black">
    <!-- React mounts here -->
    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
